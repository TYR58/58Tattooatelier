<style>
:root{
  --black:#000;
  --gold:#c9a24b;
  --gold-hi:#f4e2a6;
  --gold-dim:#8a6a1e;
  --bone:#ece6da;
  --ash:#8f877a;
  --line:#2a2620;
  --disp:'Playfair Display',Georgia,serif;
  --body:'Inter',system-ui,-apple-system,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--black);
  color:var(--bone);
  font-family:var(--body);
  min-height:100svh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:
    calc(env(safe-area-inset-top) + 2.2rem)
    1.25rem
    calc(env(safe-area-inset-bottom) + 1.75rem);
  background-image:
    radial-gradient(90% 55% at 50% 0%, rgba(201,162,75,.10), transparent 62%),
    radial-gradient(70% 45% at 50% 100%, rgba(201,162,75,.05), transparent 60%);
  background-repeat:no-repeat;
}
.wrap{width:100%;max-width:480px;margin-inline:auto;display:flex;flex-direction:column;flex:1}

/* ---------- Logo ---------- */
.logo{
  width:min(300px,78%);
  height:auto;
  margin:0 auto 1.4rem;
  display:block;
  filter:drop-shadow(0 6px 26px rgba(0,0,0,.75));
}
.tagline{
  text-align:center;
  font-family:var(--disp);
  font-size:.95rem;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--gold);
  margin-bottom:2rem;
}

/* ---------- Buttons ---------- */
.links{display:flex;flex-direction:column;gap:.85rem}
.btn{
  display:flex;
  align-items:center;
  gap:.95rem;
  width:100%;
  min-height:64px;
  padding:1rem 1.15rem;
  border:2.5px solid var(--gold);
  border-radius:6px;
  background:rgba(255,255,255,.03);
  color:var(--gold);
  font-size:1.02rem;
  font-weight:500;
  letter-spacing:.02em;
  text-decoration:none;
  transition:background .22s ease, border-color .22s ease, transform .12s ease;
}
.btn:active{transform:scale(.985)}
.btn:hover{background:rgba(201,162,75,.13);border-color:var(--gold-hi);color:var(--gold-hi)}
.btn:focus-visible{outline:3px solid var(--gold-hi);outline-offset:3px}
.btn svg{width:26px;height:26px;flex:0 0 26px}
.btn .label{flex:1;text-align:left}
.btn .chev{width:16px;height:16px;flex:0 0 16px;opacity:.5}

/* Markenfarben für Wiedererkennung */
.btn-wa{border-color:#25D366;color:#e9f9ee}
.btn-wa:hover{background:rgba(37,211,102,.14);border-color:#3ee87c;color:#fff}
.btn-ig{border-color:#c9418c;color:#f6e4ef}
.btn-ig:hover{background:rgba(201,65,140,.14);border-color:#e0559f;color:#fff}

/* ---------- Sekundär: Kontakt speichern ---------- */
.secondary{margin-top:1.5rem;display:flex;justify-content:center}
.btn-small{
  display:inline-flex;
  align-items:center;
  gap:.6rem;
  min-height:46px;
  padding:.65rem 1.25rem;
  border:1px solid var(--line);
  border-radius:5px;
  background:transparent;
  color:var(--ash);
  font-size:.85rem;
  font-weight:500;
  letter-spacing:.04em;
  text-decoration:none;
  transition:.22s ease;
}
.btn-small svg{width:17px;height:17px;flex:0 0 17px}
.btn-small:hover{border-color:var(--gold);color:var(--gold)}
.btn-small:focus-visible{outline:3px solid var(--gold-hi);outline-offset:3px}

/* ---------- Footer ---------- */
.foot{
  margin-top:auto;
  padding-top:2.5rem;
  text-align:center;
  font-size:.75rem;
  color:#8f877a;
  line-height:1.9;
}
.foot a{color:#a39a8b;text-decoration:none;border-bottom:1px solid #4a443b}
.foot a:hover{color:var(--gold);border-color:var(--gold)}
.foot .sep{opacity:.5;margin:0 .45rem}
.foot .addr{display:block;margin-bottom:.35rem}

@media (max-width:360px){
  .btn{font-size:.95rem;min-height:58px;padding:.9rem 1rem;gap:.8rem}
  .btn svg{width:23px;height:23px;flex-basis:23px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
