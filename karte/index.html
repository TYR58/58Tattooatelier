<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>58 Tattooatelier – Kontakt</title>
  <link rel="icon" href="../assets/logo.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --gold: #c9a24b; --gold-hi: #f4e2a6; --bone: #ece6da; --pit: #0a0e0c; }
    html, body { height: 100%; }
    body {
      background: url('../assets/bg-carbon.jpg') center/cover no-repeat fixed;
      background-color: var(--pit);
      color: var(--bone);
      font-family: 'Inter', system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; align-items: center; gap: 2.5rem; }
    .logo { height: clamp(120px, 25vw, 280px); filter: drop-shadow(0 8px 24px rgba(201, 162, 75, 0.2)); }
    .buttons { width: 100%; display: flex; flex-direction: column; gap: 1rem; }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 0.8rem; padding: 1rem;
      border: 2px solid var(--gold); background: rgba(20, 28, 24, 0.7); color: var(--gold-hi);
      font-size: 1rem; font-weight: 600; border-radius: 4px; cursor: pointer;
      transition: all 0.3s ease; backdrop-filter: blur(10px); width: 100%; font-family: inherit;
    }
    .btn:hover { background: rgba(30, 42, 36, 0.9); border-color: var(--gold-hi); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(201, 162, 75, 0.2); }
    .btn svg { width: 20px; height: 20px; flex-shrink: 0; }
  </style>
</head>
<body>
  <div class="container">
    <img src="../assets/logo.png" alt="58 Tattooatelier" class="logo">
    <div class="buttons">
      <button class="btn" id="btnWhatsApp">WhatsApp schreiben</button>
      <button class="btn" id="btnCall">Anrufen +49 163 624 77 97</button>
      <button class="btn" id="btnInstagram">@58tattooatelier</button>
      <button class="btn" id="btnInstagramMmm">@mmm.tattoo</button>
      <button class="btn" id="btnWebsite">Zur Website</button>
      <button class="btn" id="btnReview">Bewertung schreiben</button>
    </div>
  </div>
  <script>
    const PHONE = '491636247797';
    document.getElementById('btnWhatsApp').addEventListener('click', () => { window.open(`https://wa.me/${PHONE}?text=Hallo%20Marius`, '_blank'); });
    document.getElementById('btnCall').addEventListener('click', () => { window.location.href = `tel:+${PHONE}`; });
    document.getElementById('btnInstagram').addEventListener('click', () => { window.open('https://instagram.com/58tattooatelier', '_blank'); });
    document.getElementById('btnInstagramMmm').addEventListener('click', () => { window.open('https://www.instagram.com/mmm.tattoo/', '_blank'); });
    document.getElementById('btnWebsite').addEventListener('click', () => { window.open('https://58tattooatelier.de', '_blank'); });
        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('../sw.js', { scope: '/' }).catch(err => console.log('SW:', err)); }
    document.getElementById('btnReview').addEventListener('click', () => { window.open('https://www.google.com/search?q=58+tattooatelier', '_blank'); });
  </script>
</body>
</html>
