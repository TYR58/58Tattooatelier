<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>58 Tattooatelier – Kontakt & Termin</title>
  <meta name="description" content="58 Tattooatelier Kontakt & Buchung – WhatsApp, Instagram, Anrufen oder Termin buchen.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500;1,600&family=Alex+Brush&family=Grenze+Gotisch:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --black: #000;
      --pit: #0a0e0c;
      --panel: #0e1512;
      --gold: #c9a24b;
      --gold-hi: #f4e2a6;
      --bone: #ece6da;
      --ash: #93a099;
      --smoke: #b7c2bb;
      --line: #22302a;
      --disp: 'Playfair Display', Georgia, serif;
      --gothic: 'Grenze Gotisch', 'Playfair Display', Georgia, serif;
      --body: 'Inter', system-ui, sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }
    }

    body {
      background: url('../assets/bg-carbon.jpg') center/cover no-repeat fixed;
      background-color: var(--pit);
      color: var(--bone);
      font-family: var(--body);
      line-height: 1.6;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    img {
      max-width: 100%;
      display: block;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* ===== CONTAINER ===== */
    .karte-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: clamp(2rem, 6vw, 3.5rem) clamp(1rem, 4vw, 2rem);
      gap: clamp(2rem, 5vw, 3rem);
      max-width: 900px;
      margin: 0 auto;
    }

    /* ===== HEADER ===== */
    .karte-header {
      text-align: center;
      animation: slideDown 0.6s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .karte-logo {
      height: clamp(200px, 35vw, 350px);
      margin-bottom: 2rem;
      filter: drop-shadow(0 8px 24px rgba(201, 162, 75, 0.2));
    }

    .karte-header h1,
    .karte-header p {
      display: none;
    }

    .karte-header p {
      font-family: var(--gothic);
      font-size: clamp(1.2rem, 3.5vw, 1.6rem);
      font-weight: 600;
      color: var(--smoke);
      max-width: 50ch;
      margin: 0 auto;
      letter-spacing: 0.5px;
    }

    /* ===== BUTTONS WRAPPER ===== */
    .karte-actions {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
      animation: fadeIn 0.8s ease-out 0.2s forwards;
      opacity: 0;
    }

    .karte-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
      padding: 1rem 1.5rem;
      border: 2px solid var(--gold);
      background: rgba(20, 28, 24, 0.7);
      color: var(--gold-hi);
      font-family: var(--body);
      font-size: 1rem;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.2, 0.7, 0.2, 1);
      backdrop-filter: blur(10px);
      width: 100%;
    }

    .karte-btn:hover {
      background: rgba(30, 42, 36, 0.9);
      border-color: var(--gold-hi);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(201, 162, 75, 0.2);
    }

    .karte-btn:active {
      transform: translateY(0);
    }

    .karte-btn svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    /* ===== GALLERY ===== */
    .karte-gallery-section {
      margin-top: 2rem;
      animation: fadeIn 0.8s ease-out 0.4s forwards;
      opacity: 0;
    }

    .karte-gallery-title {
      font-family: var(--disp);
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      font-weight: 700;
      color: var(--gold-hi);
      text-align: center;
      margin-bottom: 2rem;
    }

    .karte-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
    }

    .karte-gallery-item {
      aspect-ratio: 4/5;
      overflow: hidden;
      border-radius: 4px;
      border: 1px solid rgba(201, 162, 75, 0.3);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .karte-gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .karte-gallery-item:hover img {
      transform: scale(1.05);
    }

    /* ===== ANIMATIONS ===== */
    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .karte-actions {
      animation: fadeIn 0.8s ease-out 0.2s both;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 600px) {
      .karte-container {
        padding: 1.5rem 1rem;
        gap: 1.5rem;
      }

      .karte-gallery {
        grid-template-columns: repeat(2, 1fr);
        gap: 1rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .karte-header,
      .karte-actions,
      .karte-gallery-section {
        animation: none;
        opacity: 1;
      }
    }
  </style>
</head>

<body>
  <div class="karte-container">
    <!-- ===== HEADER ===== -->
    <header class="karte-header">
      <img src="assets/logo.png" alt="58 Tattooatelier" class="karte-logo">
      <h1>58 Tattooatelier</h1>
      <p>Individuelle Tattoos aus Hagen. Dein Motiv, für dich gezeichnet.</p>
    </header>

    <!-- ===== ACTION BUTTONS ===== -->
    <div class="karte-actions">
      <!-- WhatsApp -->
      <button class="karte-btn" id="btnWhatsApp" title="Schreib mir auf WhatsApp">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.67-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.076 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421-7.403h-.004a9.87 9.87 0 00-5.031 1.378c-1.563.946-2.846 2.351-3.707 3.957 1.584-1.068 3.522-1.846 5.632-2.133 2.111-.287 4.328-.083 6.487.724-1.326-1.787-3.291-3.013-5.377-3.926z"/>
        </svg>
        WhatsApp schreiben
      </button>

      <!-- Call -->
      <button class="karte-btn" id="btnCall" title="Direkt anrufen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
        </svg>
        Anrufen +49 163 624 77 97
      </button>

      <!-- Instagram 58tattooatelier -->
      <button class="karte-btn" id="btnInstagram" title="Besuche Instagram">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5" fill="none" stroke="currentColor" stroke-width="2"/>
          <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/>
          <circle cx="17.5" cy="6.5" r="1.5" fill="currentColor"/>
        </svg>
        @58tattooatelier
      </button>

      <!-- Instagram mmm.tattoo -->
      <button class="karte-btn" id="btnInstagramMmm" title="Besuche MMM Tattoo Instagram">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5" fill="none" stroke="currentColor" stroke-width="2"/>
          <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/>
          <circle cx="17.5" cy="6.5" r="1.5" fill="currentColor"/>
        </svg>
        @mmm.tattoo
      </button>

      <!-- Website -->
      <button class="karte-btn" id="btnWebsite" title="Zur Website">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2c-2.667 3.333-2.667 6.667 0 10M12 2c2.667 3.333 2.667 6.667 0 10"/>
        </svg>
        Zur Website
      </button>

      <!-- Reviews -->
      <button class="karte-btn" id="btnReview" title="Bewertung abgeben">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
        </svg>
        Bewertung schreiben
      </button>
    </div>

    <!-- ===== GALLERY ===== -->
    <section class="karte-gallery-section">
      <h2 class="karte-gallery-title">Arbeiten</h2>
      <div class="karte-gallery" id="karteGallery">
        <!-- Bilder werden per JavaScript geladen -->
      </div>
    </section>
  </div>

  <script>
    const STUDIO_PHONE = '491636247797';

    // WhatsApp
    document.getElementById('btnWhatsApp').addEventListener('click', () => {
      const msg = encodeURIComponent('Hallo Marius, ich interessiere mich für ein Tattoo!');
      window.open(`https://wa.me/${STUDIO_PHONE}?text=${msg}`, '_blank', 'noopener');
    });

    // Call
    document.getElementById('btnCall').addEventListener('click', () => {
      window.location.href = `tel:+${STUDIO_PHONE}`;
    });

    // Instagram 58tattooatelier
    document.getElementById('btnInstagram').addEventListener('click', () => {
      window.open('https://instagram.com/58tattooatelier', '_blank', 'noopener');
    });

    // Instagram mmm.tattoo
    document.getElementById('btnInstagramMmm').addEventListener('click', () => {
      window.open('https://www.instagram.com/mmm.tattoo/', '_blank', 'noopener');
    });

    // Website
    document.getElementById('btnWebsite').addEventListener('click', () => {
      window.open('https://58tattooatelier.de', '_blank', 'noopener');
    });

    // Reviews
    document.getElementById('btnReview').addEventListener('click', () => {
      window.open('https://www.google.com/search?q=58+tattooatelier+hagen', '_blank', 'noopener');
    });

    // Gallery - Lade Bilder von Cover-Ups
    async function loadGallery() {
      try {
        const response = await fetch('assets/coverups/texte.json');
        const data = await response.json();
        const gallery = document.getElementById('karteGallery');

        // Bilder in korrekter Reihenfolge laden (01.jpg, 03.jpg, 04.jpg)
        const images = ['01', '03', '04'];

        images.forEach(img => {
          if (data[img]) {
            const item = document.createElement('div');
            item.className = 'karte-gallery-item';
            item.innerHTML = `
              <img src="assets/coverups/${img}.jpg" alt="${data[img].titel}" loading="lazy">
            `;
            gallery.appendChild(item);
          }
        });
      } catch (err) {
        console.log('Gallery laden nicht möglich');
      }
    }

    loadGallery();
  </script>
</body>
</html>
